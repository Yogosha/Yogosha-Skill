# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
stages:
- test
- secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'

# Adapters must match RULES.md, the helper scripts must compile, and the API
# helper's dry-run must work without credentials.
check:
  stage: test
  image: python:3.12-alpine
  script:
  - python scripts/build_adapters.py --check
  - python -m py_compile scripts/yogosha_api.py scripts/build_adapters.py
  - python -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json'))"
  - printf '{"title":"t","vulnerability":"x","program":"p","content":{"abstract":"a"}}' > /tmp/body.json
  - python scripts/yogosha_api.py create-draft --body-file /tmp/body.json | grep -q '"dryRun": true'

secret_detection:
  stage: secret-detection

include:
- template: Security/Secret-Detection.gitlab-ci.yml
